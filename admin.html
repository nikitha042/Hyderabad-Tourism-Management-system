<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
}


.header{
    background:#1f4e79;
    color:white;
    padding:20px;
    text-align:center;
}


.container{
    padding:30px;
}


.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    margin-bottom:20px;
}


button{

    background:#1f4e79;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;

}


button:hover{
    background:#163a5c;
}


.logout{

    background:red;
    float:right;

}


table{

    width:100%;
    border-collapse:collapse;
    background:white;

}


th{

    background:#1f4e79;
    color:white;
    padding:12px;

}


td{

    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;

}


tr:hover{

    background:#f1f1f1;

}


.search{

    padding:10px;
    width:300px;
    border-radius:5px;
    border:1px solid gray;

}

</style>

</head>


<body>


<div class="header">

<h1>Admin Dashboard</h1>
<a href="/logout">
<button class="logout">Logout</button>
</a>

<br><br>

<a href="/export">
<button>Export to Excel</button>
</a>


</div>


<div class="container">
<div class="card">

<h2>Dashboard Overview</h2>

<p><b>Total Messages:</b> {{ total_messages }}</p>

<p><b>Total Users:</b> {{ total_users }}</p>

<p><b>Latest Message:</b> {{ latest_time }}</p>

</div>   




<div class="card">

<h2>Contact Messages</h2>


<form method="GET" action="/admin">

<input class="search"
type="text"
name="search"
placeholder="Search name or email">


<button type="submit">
Search
</button>

</form>


</div>



<div class="card">


<table>


<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Message</th>
<th>Date & Time</th>
<th>Actions</th>

</tr>



{% for msg in messages %}


<tr>

<td>{{msg[0]}}</td>

<td>{{msg[1]}}</td>

<td>{{msg[2]}}</td>

<td>{{msg[3]}}</td>

<td>{{msg[4]}}</td>


<td>


<a href="/edit/{{msg[0]}}">
<button>Edit</button>
</a>


<a href="/delete/{{msg[0]}}">
<button onclick="return confirm('Delete this message?')">
Delete
</button>
</a>


</td>


</tr>


{% endfor %}



</table>


</div>


</div>


</body>

</html>
